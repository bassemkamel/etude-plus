name: etudeplus

services:
  postgres:
    image: postgres:16-alpine
    container_name: etudeplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etude}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etude}
      POSTGRES_DB: ${POSTGRES_DB:-etudeplus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etude} -d ${POSTGRES_DB:-etudeplus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - etudeplus

  adminer:
    image: adminer:4
    container_name: etudeplus-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - etudeplus

  redis:
    image: redis:7-alpine
    container_name: etudeplus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - etudeplus

  mailhog:
    image: axllent/mailpit:v1.27
    container_name: etudeplus-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - etudeplus

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: etudeplus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-etude}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-etudeplus_minio}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - etudeplus

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: etudeplus-minio-init
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-etude}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-etudeplus_minio}
      S3_BUCKET: ${S3_BUCKET:-etudeplus}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        i=0
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          i=$$((i+1))
          if [ $$i -gt 30 ]; then echo "MinIO unreachable"; exit 1; fi
          sleep 2
        done
        mc mb -p "local/$$S3_BUCKET" || true
        echo "MinIO bucket ready: $$S3_BUCKET"
    networks:
      - etudeplus

networks:
  etudeplus:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
